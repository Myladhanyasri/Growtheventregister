<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NxtWave AI Growth Experience (Prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8ee;--sf:#fff;--sf2:#edf2dc;--tx:#0b1200;--mu:#586349;--ac:#4d7c0f;--pt:#3f6b0a;--ok:#059669;--bd:#d6dfbf;--on:#fff;--cy:#0e7490;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b14;--sf:#0e1524;--sf2:#16203a;--tx:#eef3ff;--mu:#93a0c2;--ac:#c6f24e;--pt:#c6f24e;--ok:#34d399;--bd:#223052;--on:#0b1200;--cy:#38d6ff}}
:root[data-theme="dark"]{--bg:#070b14;--sf:#0e1524;--sf2:#16203a;--tx:#eef3ff;--mu:#93a0c2;--ac:#c6f24e;--pt:#c6f24e;--ok:#34d399;--bd:#223052;--on:#0b1200;--cy:#38d6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 88% -8%,rgba(56,214,255,.16),transparent),radial-gradient(700px 420px at -5% 8%,rgba(198,242,78,.12),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 'Space Grotesk',system-ui,sans-serif}
a{color:inherit}nav{display:flex;gap:4px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
nav b{margin-right:auto;white-space:nowrap;font-size:16px}nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--mu);white-space:nowrap;font-weight:600;font-size:14px}nav a.on{background:var(--ac);color:var(--on)}
main{max-width:1050px;margin:0 auto;padding:20px 16px 60px}h1{font-size:clamp(34px,7vw,64px);line-height:1.02;margin:0 0 14px;letter-spacing:-1.5px}h2{margin:0 0 10px;font-size:22px}h3{margin:0 0 6px;font-size:16px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px}.mu{color:var(--mu)}.pt{color:var(--pt);font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:var(--on);text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}.btn.s{padding:7px 12px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pt);outline-offset:2px}
input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-weight:600;font-size:13px}.bar{height:12px;border-radius:9px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ac));border-radius:9px;transition:width .8s}
.hero{padding:30px 0 24px}.big{font-size:19px;max-width:620px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--sf2);color:var(--mu)}.demo{background:var(--pt);color:#1a1200}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}td.r,th.r{text-align:right}
.cd{display:flex;gap:10px}.cd div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;text-align:center;min-width:62px}.cd b{font-size:24px;display:block}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--sf2);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:10px;font:inherit;cursor:pointer}.opt.good{border-color:var(--ok)}.opt.bad{border-color:#e11d48}
pre{background:var(--sf2);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ok);color:#052;padding:12px 20px;border-radius:12px;font-weight:700;transition:transform .35s;z-index:9;max-width:90%}#toast.show{transform:translate(-50%,0)}
.big-n{font-size:34px;font-weight:700;line-height:1}.fun div{padding:8px 0;border-bottom:1px solid var(--bd)}.fun i{display:block;height:8px;border-radius:5px;background:var(--ac);margin-top:4px}
.st{display:block;text-decoration:none;position:relative;border:1px solid var(--bd);background:linear-gradient(160deg,var(--sf2),var(--sf));border-radius:16px;padding:18px;transition:transform .2s,border-color .2s}.st:hover{transform:translateY(-3px);border-color:var(--ac)}
.st .n{position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--on);font-weight:700;display:grid;place-items:center;font-size:13px}.st .e{font-size:30px}.st b.p{display:inline-block;margin:6px 0;color:var(--cy);font-size:13px}
.ban{border:1.5px solid var(--ac);border-radius:16px;padding:18px;margin:10px 0 16px;background:linear-gradient(120deg,var(--sf2),var(--sf))}
h1{background:linear-gradient(90deg,var(--tx),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.c{box-shadow:0 10px 34px rgba(0,0,0,.16)}.btn:not(.o){box-shadow:0 0 26px rgba(198,242,78,.28)}.btn:not(.o):hover{filter:brightness(1.08)}
.hg{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}@media(max-width:820px){.hg{grid-template-columns:1fr}}
.glow{border-color:var(--ac);box-shadow:0 0 70px rgba(56,214,255,.18)}.chip{font-size:12px;font-weight:700;padding:5px 10px;border:1px solid var(--bd);border-radius:20px;color:var(--mu)}
.feed div{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;background:var(--sf2);margin-top:6px;font-size:13px}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:10;border-radius:2px;animation:fall 1.7s ease-in forwards}@keyframes fall{to{transform:translateY(108vh) rotate(560deg);opacity:.3}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const DEF={reg:50,profile:25,refer:100,friend:150,attend:100,ask:50,chal:100,win:50,proj:200,help:25};
const LBL={reg:'Register',profile:'Complete profile',refer:'Refer a friend',friend:'Friend registers',attend:'Attend workshop',ask:'Ask an expert',chal:'Complete AI challenge',win:'Win a mini-game',proj:'Complete final AI project',help:'Help a participant'};
const REW=[[500,'AI Starter Pack',499],[1000,'Advanced Prompt Engineering Resource',999],[2000,'AI/GenAI Learning Bundle',1999],[3000,'Advanced AI Workshop',2999],[5000,'Premium Career + AI Learning Bundle',4999]];
const LV=[[0,'Explorer'],[500,'Builder'],[1500,'Creator'],[3000,'AI Pro'],[5000,'AI Champion']];
const BOT=[['Ananya',4850],['Rahul',4600],['Priya',4100],['Karthik',3300],['Meera',2900],['Arjun',2450],['Sana',1900],['Vikram',1500],['Isha',900],['Rohan',620]];
const EXP=[['AI/ML Engineer','5+ yrs',['AI careers','Building AI projects','Interviews']],['GenAI Developer','3+ yrs',['Prompt engineering','AI agents','Internships']],['Data Scientist','4+ yrs',['Data science paths','Industry skills','Portfolios']]];
const POPQ=[['How do I get an AI internship as a fresher?','Build 2 small shipped projects, put them on GitHub with a short demo video, and apply with a one-line impact summary. (Demo answer)'],['ML or GenAI first?','Start with GenAI to build quickly, then learn ML fundamentals to understand why it works. (Demo answer)'],['What should my first AI project be?','Pick a problem you face daily and solve it with an LLM plus a simple UI. (Demo answer)']];
const TRIV=[['What does RAG stand for?',['Retrieval-Augmented Generation','Rapid AI Graph','Recursive Agent Gateway'],0],['Which setting makes LLM output more random?',['Max tokens','Temperature','Stop sequence'],1],['A "token" in an LLM is best described as…',['A login credential','A chunk of text the model reads','A GPU core'],1]];
const DAYS=['Launch + registration','AI Trivia + referral challenge','Industry Expert teaser','Prompt Battle','Leaderboard competition','Final referral push + reward preview','Main AI workshop + project challenge'];
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem('nw3'));if(x)return x}catch(e){}return{cfg:{...DEF},u:null,users:[],ev:Date.now()+6.5*864e5}}
function save(){try{localStorage.setItem('nw3',JSON.stringify(S))}catch(e){}}
const lvl=p=>{let l=0;LV.forEach((x,i)=>{if(p>=x[0])l=i});return l};
const nextR=p=>REW.find(r=>r[0]>p);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function add(k,n,note){const u=S.u;if(!u)return;const v=n??S.cfg[k];const b=u.pts;u.pts+=v;if(REW.some(r=>b<r[0]&&u.pts>=r[0]))boom();u.hist.unshift({t:note||LBL[k],v,d:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});save();toast('🎉 +'+v+' points! You are now at '+u.pts.toLocaleString()+' points.')}
function once(id,k,note){const u=S.u;if(u.done[id])return toast('Already completed. Try another challenge.');u.done[id]=1;add(k,null,note)}
function demoUser(){return{name:'Dhanya',email:'dhanya@demo.test',college:'Demo Institute of Technology',branch:'CSE',year:'2026',code:'DHA123',pts:1250,interest:'GenAI',streak:3,done:{},clicks:21,refs:3,hist:[{t:'Referral: friend registered ×3',v:450,d:'—'},{t:'AI Challenge',v:100,d:'—'},{t:'Expert Question',v:50,d:'—'},{t:'Win a mini-game',v:50,d:'—'},{t:'Complete profile',v:25,d:'—'},{t:'Register',v:50,d:'—'},{t:'Earlier activity (demo)',v:525,d:'—'}]}}
function link(){return location.href.split('#')[0]+'#/register?ref='+S.u.code}
function msg(){return `🚀 I'm joining NxtWave's "Build Your First AI Project in 60 Minutes" experience.\n\nWe get to build an AI project, interact with industry experts, compete in AI challenges and earn points that can unlock premium learning rewards.\n\nJoin me: ${link()}`}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>toast('Select and copy: '+t.slice(0,40)))}
function nav(){const r=route()[0],L=[['','Home'],['dash','Dashboard'],['play','Challenges'],['experts','Industry Connect'],['board','Leaderboard'],['rewards','Rewards'],['event','Live Event'],['admin','Admin']];
$('#nav').innerHTML='<b>⚡ NxtWave AI Growth <span class="tag demo">PROTOTYPE</span></b>'+L.map(l=>`<a href="#/${l[0]}" class="${r===l[0]?'on':''}">${l[1]}</a>`).join('')+`<a href="#" onclick="toggleT();return false">◐</a>`}
function toggleT(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'}
function route(){const h=location.hash.slice(2).split('?');return[h[0],new URLSearchParams(h[1]||'')]}
function need(){if(S.u)return false;$('#app').innerHTML='<div class="c"><h2>Register to start earning</h2><p class="mu">Create your profile or try the demo student.</p><a class="btn" href="#/register">Register</a> <button class="btn o" onclick="startDemo()">Try demo student</button></div>';return true}
function startDemo(){S.u=demoUser();save();location.hash='#/dash'}
function cdown(){const d=Math.max(0,S.ev-Date.now()),f=[[864e5,'days'],[36e5,'hrs'],[6e4,'min'],[1e3,'sec']];return f.map(x=>{const n=Math.floor(d/x[0]);d-=0;return[n,x[1]]}).map((x,i,a)=>x)}
function cdHTML(){let d=Math.max(0,S.ev-Date.now());return '<div class="cd" id="cd">'+[[864e5,'days'],[36e5,'hrs'],[6e4,'min'],[1e3,'sec']].map(x=>{const n=Math.floor(d/x[0]);d-=n*x[0];return`<div><b>${String(n).padStart(2,'0')}</b><span class="mu">${x[1]}</span></div>`}).join('')+'</div>'}
setInterval(()=>{const e=$('#cd');if(e)e.outerHTML=cdHTML()},1000);
const V={
'':()=>`<section class="hero hg"><div><span class="tag">Final-year engineering students · limited slots · simulated data</span><h1 style="margin-top:12px">Build. Compete.<br>Connect. Unlock.</h1>
<p class="big">Build Your First AI Project in 60 Minutes, and turn your participation into rewards.</p><div class="row" style="margin:18px 0">${cdHTML()}</div>
<div class="row"><a class="btn" href="#/register">REGISTER &amp; START EARNING</a><a class="btn o" href="#how">SEE HOW IT WORKS</a><button class="btn o" onclick="startDemo()">▶ Demo mode (Dhanya)</button></div>
<div class="row" style="margin-top:16px"><span class="chip">🎤 Industry interaction</span><span class="chip">🎮 AI challenges</span><span class="chip">🏆 Leaderboard</span><span class="chip">🎁 Exclusive rewards</span></div></div>
<div class="c glow"><span class="tag demo">Live preview · simulated</span><div class="row" style="justify-content:space-between;margin-top:10px"><b>Dhanya · Level 2 Builder</b><span class="mu">Rank #3</span></div><div class="big-n pt" style="margin:8px 0">1,250 pts</div>
<div class="bar"><i style="width:62%"></i></div><small class="mu">750 more points to unlock the AI/GenAI Learning Bundle</small>
<div class="feed" style="margin-top:10px"><div><span>🔗 Friend registered</span><b class="pt">+150</b></div><div><span>🎮 AI challenge</span><b class="pt">+100</b></div><div><span>💬 Expert question</span><b class="pt">+50</b></div></div>
<p style="margin:14px 0 4px"><b>347 / 500</b> <span class="mu">seats claimed (simulated)</span></p><div class="bar"><i style="width:69.4%"></i></div></div></section>
<h2 style="margin-top:6px">Earn points. Unlock courses.</h2>${steps()}<div class="g g3" id="how">${[['🎤','Industry Connect','Ask professionals your career and technical doubts.'],['🎮','AI challenges','Trivia, Prompt Battle, Debug the AI and more.'],['⭐','Points + levels','Every meaningful action earns points. Climb 5 levels.'],['🏆','Leaderboard','Compete with students across colleges.'],['🎁','Premium rewards','Unlock learning resources that normally cost money.'],['🔗','Referrals','Invite friends. Both of you move up faster.']].map(x=>`<div class="c"><div style="font-size:26px">${x[0]}</div><h3>${x[1]}</h3><span class="mu">${x[2]}</span></div>`).join('')}</div>
<h2 style="margin-top:28px">The 7-day campaign (configurable)</h2><div class="g g3">${DAYS.map((d,i)=>`<div class="c"><b>Day ${i+1}</b><br><span class="mu">${d}</span></div>`).join('')}</div>
<div class="c" style="margin-top:20px"><h2>Why attend another webinar?</h2><p class="mu">Build an AI project, talk to industry experts, compete with other students, earn points and unlock valuable learning resources.</p></div>`,
register:()=>{const ref=route()[1].get('ref');if(ref&&!sessionStorage.refSeen){try{sessionStorage.refSeen=1}catch(e){}toast('Referred by '+ref+': both of you earn points')}
return`<div class="c" style="max-width:520px;margin:auto"><h2>Register for the workshop</h2>${ref?`<p class="pt">Referred by code ${ref}</p>`:''}<form onsubmit="return reg(event,'${ref||''}')">
${[['name','Name','text'],['email','Email','email'],['phone','Phone number','tel'],['college','College','text']].map(f=>`<label>${f[1]}<input name="${f[0]}" type="${f[2]}" required></label>`).join('')}
<label>Branch<select name="branch"><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mech</option><option>Civil</option><option>Other</option></select></label>
<label>Graduation year<select name="year"><option>2026</option><option>2027</option></select></label><button class="btn" style="width:100%">Register and earn 50 points</button></form></div>`},
dash:()=>{if(need())return'';const u=S.u,n=nextR(u.pts),L=lvl(u.pts);
const rec={GenAI:['Prompt Battle','AI Project Challenge','AI/GenAI Learning Bundle'],'Machine Learning':['AI Trivia','Debug the AI','AI Starter Pack'],'Web Development':['Guess the AI Output','AI Project Challenge','AI Starter Pack'],'Data Science':['AI Trivia','Debug the AI','Advanced Prompt Engineering Resource'],'Prompt Engineering':['Prompt Battle','Guess the AI Output','Advanced Prompt Engineering Resource'],'AI Agents':['AI Project Challenge','Debug the AI','AI/GenAI Learning Bundle']}[u.interest];
const ways=n?[['Refer 2 friends (+'+S.cfg.friend*2+')',S.cfg.friend*2],['Complete an AI challenge',S.cfg.chal],['Ask an expert question',S.cfg.ask],['Complete the project',S.cfg.proj],['Win a game',S.cfg.win]]:[];
return`<h1 style="font-size:34px">Welcome, ${u.name}.</h1>${u.pts<500?`<div class="ban"><h2>🎉 You're registered! You've earned ${u.pts} points.</h2><p>Your first course unlocks at <b class="pt">500 points</b>. Do these four things to get there:</p></div>`:''}${steps()}<div class="g g2"><div class="c"><span class="mu">Your points · Level ${L+1}: ${LV[L][1]}</span><div class="big-n pt">${u.pts.toLocaleString()}</div>
${n?`<p>🔥 You're only <b>${n[0]-u.pts}</b> points away from <b>${n[1]}</b> (value ₹${n[2]}, demo value).</p><div class="bar"><i style="width:${Math.min(100,u.pts/n[0]*100)}%"></i></div><small class="mu">${u.pts} / ${n[0]} points</small>`:'<p>All rewards unlocked 🎉</p>'}
<p class="mu">🔥 Day ${u.streak} streak. Complete today's AI challenge to earn +150 points.</p></div>
<div class="c"><h2>Want to unlock rewards faster? Invite your friends.</h2><p>Your referral code: <b class="pt" style="font-size:22px">${u.code}</b></p><small class="mu" style="word-break:break-all">${link()}</small>
<div class="row" style="margin:10px 0"><button class="btn s" onclick="copy(link(),'Link copied')">Copy link</button><a class="btn s" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg())}">Share on WhatsApp</a><button class="btn s o" onclick="navigator.share?navigator.share({text:msg()}):copy(msg(),'Message copied')">Share</button><button class="btn s o" onclick="copy(msg(),'Message copied')">Copy message</button></div>
<div class="row"><button class="btn s o" onclick="sim('click')">Simulate link click</button><button class="btn s o" onclick="sim('reg')">Simulate friend registering</button></div></div></div>
<div class="g g3" style="margin-top:14px">${[['Clicks',u.clicks],['Registrations from referral',u.refs],['Successful referrals',u.refs],['Points earned from referrals',u.refs*(S.cfg.friend)],['Conversion rate',u.clicks?Math.round(u.refs/u.clicks*100)+'%':'0%']].map(x=>`<div class="c"><span class="mu">${x[0]}</span><div class="big-n">${x[1]}</div></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c"><h2>Recommended for ${u.interest}</h2>${rec.map(r=>'🎯 '+r).join('<br>')}<br><br><label>What do you want to learn?<select onchange="S.u.interest=this.value;save();render()">${['GenAI','Machine Learning','Web Development','Data Science','Prompt Engineering','AI Agents'].map(o=>`<option ${o===u.interest?'selected':''}>${o}</option>`).join('')}</select></label>
<button class="btn s o" onclick="once('profile','profile')">Complete profile (+${S.cfg.profile})</button></div>
${n?`<div class="c"><h2>Ways to earn ${n[0]-u.pts} more points</h2>${ways.map(w=>`<div class="fun"><div>${w[0]} <b class="pt">+${w[1]}</b></div></div>`).join('')}<a class="btn s" style="margin-top:10px" href="#/play">Play now</a></div>`:''}</div>
<div class="c" style="margin-top:14px"><h2>Points history</h2><table>${u.hist.slice(0,12).map(h=>`<tr><td>${h.t}</td><td class="r pt">+${h.v}</td><td class="r mu">${h.d}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="r pt"><b>${u.pts.toLocaleString()} points</b></td><td></td></tr></table></div>`},
play:()=>{if(need())return'';return`<h1 style="font-size:34px">AI challenges</h1><p class="mu">Complete challenges to earn points. Each one counts once.</p><div class="g g2" id="games"></div>`},
experts:()=>{if(need())return'';return`<h1 style="font-size:34px">Industry Connect</h1><p class="mu">Example expert profiles, simulated for this prototype. No real professional is claimed to participate.</p>
<div class="g g3">${EXP.map(e=>`<div class="c"><span class="tag demo">Demo Expert</span><h3 style="margin-top:8px">${e[0]}</h3><div class="mu">Experience: ${e[1]}</div><ul style="padding-left:18px">${e[2].map(t=>`<li>${t}</li>`).join('')}</ul><div class="row"><a href="#askbox" class="btn s">Ask a Question</a><button class="btn s o" onclick="toast('Session joining opens on event day (demo)')">Join Expert Session</button></div></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c" id="askbox"><h2>What would you like to ask an industry expert?</h2><textarea id="q" rows="3" placeholder="Type your question…"></textarea><button class="btn" onclick="ask()">Submit question (+${S.cfg.ask})</button>
${S.u.qs?.length?'<h3 style="margin-top:14px">Your questions</h3>'+S.u.qs.map(q=>`<p>• ${esc(q)} <span class="tag">Pending</span></p>`).join(''):''}</div>
<div class="c"><h2>Popular questions</h2>${POPQ.map(q=>`<details><summary><b>${q[0]}</b> <span class="tag">Answered</span></summary><p class="mu">${q[1]}</p></details>`).join('')}</div></div>`},
board:()=>{if(need())return'';const u=S.u,all=[...BOT.map(b=>({n:b[0],p:b[1]})),{n:u.name+' (you)',p:u.pts,me:1}].sort((a,b)=>b.p-a.p),pos=all.findIndex(x=>x.me)+1,B=['🥇 AI Champion','🥈 AI Explorer','🥉 AI Builder'];
return`<h1 style="font-size:34px">🏆 AI Growth Leaderboard</h1><span class="tag demo">Simulated participants</span><div class="g g2" style="margin-top:12px"><div class="c"><table>${all.map((x,i)=>`<tr style="${x.me?'background:var(--sf2);font-weight:700':''}"><td>#${i+1}</td><td>${x.n} <span class="mu">${i<3?B[i]:''}</span></td><td class="r pt">${x.p.toLocaleString()} pts</td></tr>`).join('')}</table></div>
<div class="c"><span class="mu">Your position</span><div class="big-n">#${pos}</div><br><span class="mu">Your points</span><div class="big-n pt">${u.pts.toLocaleString()}</div><h3 style="margin-top:16px">Levels</h3>${LV.map((l,i)=>`<div style="${i===lvl(u.pts)?'font-weight:700;color:var(--pt)':''}">Level ${i+1}: ${l[1]} <span class="mu">(${l[0]}+)</span></div>`).join('')}</div></div>`},
rewards:()=>{if(need())return'';const u=S.u;return`<h1 style="font-size:34px">Reward marketplace</h1><p>Your points: <b class="pt">${u.pts.toLocaleString()}</b>. <span class="tag demo">Values are demo values</span></p><div class="g g3">${REW.map(r=>{const ok=u.pts>=r[0],got=u.rw&&u.rw[r[0]],gap=r[0]-u.pts;return`<div class="c" style="${ok?'border-color:var(--ok)':''}"><b class="pt">${r[0].toLocaleString()} points</b><h3>${r[1]}</h3><div class="mu">Value ₹${r[2]}</div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,u.pts/r[0]*100)}%"></i></div>${got?'<b style="color:var(--ok)">✅ Claimed. Check your email (demo)</b>':ok?`<button class="btn s" onclick="claim(${r[0]})">🔓 Unlock reward</button>`:`<span class="mu">🔒 ${gap} more points to unlock</span>`}${ok&&gap<0?'':''}</div>`}).join('')}</div>`},
event:()=>{if(need())return'';return`<h1 style="font-size:34px">Live event <span class="tag" style="background:#e11d48;color:#fff">LIVE NOW (demo)</span></h1><div class="g g3">${[['🎤','Industry Expert Session','#/experts'],['🎮','AI Challenge','#/play'],['🏆','Leaderboard','#/board'],['💬','Ask Expert','#/experts'],['⚡','Build Your AI Project',''],['🎁','Rewards','#/rewards']].map(x=>`<${x[2]?'a href="'+x[2]+'"':'div'} class="c" style="text-decoration:none"><div style="font-size:26px">${x[0]}</div><b>${x[1]}</b></${x[2]?'a':'div'}>`).join('')}</div>
<div class="c" style="margin-top:14px"><h2>5-MINUTE AI CHALLENGE</h2><p>Complete this challenge and earn ${S.cfg.chal} points. Fastest correct answer: what does an LLM predict next?</p>${['The next token','The next image','The user\'s name'].map((o,i)=>`<button class="opt" onclick="${i?'toast(\'Not quite, try again\')':'once(\'ev5\',\'chal\',\'5-minute AI challenge\');render()'}">${o}</button>`).join('')}</div>
<div class="c" style="margin-top:14px"><h2>Project step</h2><p class="mu">Build a simple AI app in 60 minutes with the mentor, then mark it done.</p><button class="btn" onclick="once('proj','proj');render()">I built my AI project (+${S.cfg.proj})</button> <button class="btn o" onclick="once('att','attend');render()">Mark attendance (+${S.cfg.attend})</button></div>`},
admin:()=>{const real=S.users.length,T=347+real,src=[['Referrals',180],['WhatsApp',75],['College Clubs',50],['Social Media',30],['Email',12]],F=[['Campaign viewed',2400],['Landing page visited',1150],['Registered',T],['Referred friend',212],['Friend registered',180],['Participated',241],['Completed challenge',168],['Unlocked reward',74]];
return`<h1 style="font-size:34px">Growth dashboard</h1><span class="tag demo">SIMULATED DATA${real?' + '+real+' real local registration(s)':''}</span>
<div class="c" style="margin-top:12px"><h2>🎯 Registration target</h2><div class="big-n">${T} / 500</div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,T/5)}%"></i></div><b>${(T/5).toFixed(1)}%</b> · ${Math.max(0,500-T)} registrations remaining</div>
<div class="g g3" style="margin:14px 0">${[['Registrations today',41],['Referral registrations',180],['Organic registrations',T-180],['Referral conversion',(180/T*100|0)+'%'],['Cost per registration','₹'+(2000/T).toFixed(2)],['Points distributed','186,400'],['Active participants',241],['Challenge participation','48%'],['Reward unlocks',74]].map(x=>`<div class="c"><span class="mu">${x[0]}</span><div class="big-n">${x[1]}</div></div>`).join('')}</div>
<div class="g g2"><div class="c"><h2>Acquisition source</h2><table>${src.map(s=>`<tr><td>${s[0]}</td><td class="r">${s[1]}</td></tr>`).join('')}</table><p class="mu">Budget ₹2,000: no paid ads. Spend only on small rewards and community outreach.</p></div>
<div class="c fun"><h2>Registration funnel</h2>${F.map((f,i)=>`<div>${f[0]} <b style="float:right">${f[1].toLocaleString()}${i?' · '+(f[1]/F[i-1][1]*100).toFixed(0)+'%':''}</b><i style="width:${f[1]/24}%"></i></div>`).join('')}</div></div>
<div class="c" style="margin-top:14px"><h2>Point values (editable)</h2><div class="g g3">${Object.keys(S.cfg).map(k=>`<label>${LBL[k]}<input type="number" min="0" value="${S.cfg[k]}" onchange="S.cfg['${k}']=+this.value;save();toast('Saved')"></label>`).join('')}</div><button class="btn s o" onclick="S.cfg={...DEF};save();render()">Reset defaults</button></div>
<div class="c" style="margin-top:14px"><h2>Why this works</h2><div class="g g3">${[['Acquisition','Referrals and student communities drive registrations.'],['Engagement','Games, challenges and expert interaction prevent passive attendance.'],['Retention','Points, levels and rewards encourage continued participation.'],['Virality','Students have a direct incentive to invite friends.'],['Value exchange','Students receive valuable resources for meaningful participation.'],['Measurement','The dashboard tracks the funnel and growth metrics.']].map(x=>`<div><h3>${x[0]}</h3><span class="mu">${x[1]}</span></div>`).join('')}</div><p class="mu">Loop: attract, register, engage, earn, refer, grow, unlock, share.</p><button class="btn s o" onclick="if(confirm('Reset all prototype data?')){localStorage.removeItem('nw3');S=load();location.hash='#/';render()}">Reset prototype</button></div>`}};
function steps(){const g=!!S.u,L=(a)=>g?a:'#/register',c=S.cfg;return`<div class="g g3" style="margin:14px 0">${[['1','🔗','Refer friends','+'+c.friend+' points per friend',g?'Share your code on WhatsApp':'Get your personal code after registering',g?'#/dash':'#/register'],['2','🎮','Play AI games','+'+c.win+' to +'+c.chal+' per game','Trivia, Prompt Battle, Debug the AI','#/play'],['3','💬','Ask industry experts','+'+c.ask+' per question','Get career and project doubts answered','#/experts'],['4','🔓','Unlock courses','From 500 points','Starter pack up to the career bundle','#/rewards']].map(x=>`<a class="st" href="${x[0]==1?x[5]:L(x[5])}"><span class="n">${x[0]}</span><div class="e">${x[1]}</div><h3>${x[2]}</h3><b class="p">${x[3]}</b><div class="mu">${x[4]}</div></a>`).join('')}</div>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function reg(e,ref){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),first=f.name.trim().split(' ')[0],code=(first.slice(0,3).toUpperCase().padEnd(3,'X'))+(100+Math.floor(Math.random()*900));
S.u={...f,name:first,code,pts:0,hist:[],done:{},clicks:0,refs:0,streak:1,interest:'GenAI',qs:[]};S.users.push(code);add('reg');if(ref)toast('🎉 Welcome! +50 points. Your friend '+ref+' earns +'+S.cfg.friend);save();location.hash='#/dash';return false}
function sim(t){const u=S.u;if(t==='click'){u.clicks++;save();render()}else{u.clicks++;u.refs++;add('friend',null,'Referral: friend registered');render()}}
function ask(){const v=$('#q').value.trim();if(v.length<8)return toast('Write a bit more so an expert can help');S.u.qs=[...(S.u.qs||[]),v];add('ask',null,'Expert question');render()}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.cssText='left:'+Math.random()*100+'vw;background:'+['#c6f24e','#38d6ff','#ff6b9d','#ffb547'][i%4]+';animation-delay:'+Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}}
function claim(c){boom();S.u.rw=S.u.rw||{};S.u.rw[c]=1;save();toast('🔓 Reward unlocked: '+REW.find(r=>r[0]===c)[1]);render()}
let tq=0,tc=0;
function games(){const el=$('#games');if(!el)return;const u=S.u,d=k=>u.done[k]?'<span class="tag" style="background:var(--ok);color:#052">Completed</span>':'';
const tr=tq<TRIV.length?`<b>${TRIV[tq][0]}</b>${TRIV[tq][1].map((o,i)=>`<button class="opt" onclick="tAns(${i},this)">${o}</button>`).join('')}`:`<p>Score: ${tc}/${TRIV.length}</p><button class="btn s o" onclick="tq=0;tc=0;games()">Replay</button>`;
el.innerHTML=`<div class="c"><h2>AI Trivia ${d('trivia')}</h2>${tr}<small class="mu">Get 2+ right to win +${S.cfg.win}</small></div>
<div class="c"><h2>Debug the AI ${d('debug')}</h2><pre>def avg(nums):\n    total = 0\n    for n in nums:\n        total += n\n    return total / len(num)</pre>${['Rename len(num) to len(nums)','Change += to =','Remove the loop'].map((o,i)=>`<button class="opt" onclick="pick(this,${i==0},'debug','win')">${o}</button>`).join('')}</div>
<div class="c"><h2>Guess the AI output ${d('guess')}</h2><p class="mu">Prompt: "Explain overfitting to a 10-year-old in one sentence."</p>${['Overfitting is when a model memorises examples so well it fails on new ones, like learning answers by heart instead of understanding.','Overfitting is the bias-variance tradeoff in regularised empirical risk.','I cannot help with that.'].map((o,i)=>`<button class="opt" onclick="pick(this,${i==0},'guess','win')">${o}</button>`).join('')}</div>
<div class="c"><h2>Prompt Battle ${d('prompt')}</h2><p class="mu">Write the best prompt to make an AI generate a marketing idea for a college event. Scored on role, audience, constraints and format.</p><textarea id="pb" rows="4"></textarea><button class="btn s" onclick="pbScore()">Submit prompt (+${S.cfg.chal})</button><div id="pbr"></div></div>
<div class="c" style="grid-column:1/-1"><h2>AI Project Idea Challenge ${d('idea')}</h2><p class="mu">How would you use AI to improve college transportation?</p><textarea id="pi" rows="3"></textarea><button class="btn s" onclick="idea()">Submit idea (+${S.cfg.chal})</button></div>`}
function tAns(i,b){const ok=i===TRIV[tq][2];if(ok)tc++;b.classList.add(ok?'good':'bad');setTimeout(()=>{tq++;if(tq>=TRIV.length&&tc>=2)once('trivia','win','AI Trivia win');games()},700)}
function pick(b,ok,id,k){b.classList.add(ok?'good':'bad');if(ok)once(id,k,{debug:'Debug the AI',guess:'Guess the AI output'}[id]);else toast('Not quite, try again');if(ok)setTimeout(games,900)}
function pbScore(){const v=$('#pb').value.toLowerCase(),c=[['Role',/(act as|you are|as a)/],['Audience',/(student|college|campus|freshers)/],['Constraints',/(budget|under|within|limit|\d)/],['Format',/(list|table|bullet|steps|json|3 |three)/]],s=c.filter(x=>x[1].test(v)).length;
$('#pbr').innerHTML=`<p><b>Score ${s}/4</b> ${c.map(x=>(x[1].test(v)?'✅ ':'⬜ ')+x[0]).join(' · ')}</p>`;if(s>=2)once('prompt','chal','Prompt Battle');else toast('Add at least 2 criteria to earn points')}
function idea(){if($('#pi').value.trim().split(/\s+/).length<10)return toast('Describe your idea in at least 10 words');once('idea','chal','AI Project Idea Challenge');games()}
function render(){nav();const r=route()[0];$('#app').innerHTML=(V[r]||V[''])();if(r==='play')games();scrollTo(0,0)}
addEventListener('hashchange',()=>{if(location.hash==='#how'){return}render()});render();
</script></body></html>
